---
# Builds each decompression backend for amd64 and arm64 on native runners
# (no QEMU), smoke-tests every image, then pushes by digest and stitches the
# per-arch images into multi-arch tags. Nothing is pushed unless the smoke test
# passes, and nothing is pushed for pull requests.
name: Build and push images
on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - root/**
      - .github/scripts/smoke-test.sh
      - .github/workflows/docker-build-and-publish.yml
  workflow_dispatch:

env:
  DOCKERHUB_SLUG: xthursdayx/yacreaderlibrary-server-docker
  GHCR_SLUG: ghcr.io/xthursdayx/yacreaderlibrary-server-docker

jobs:
  build:
    name: build (${{ matrix.backend }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: [7zip, libarchive]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DECOMPRESSION_BACKEND=${{ matrix.backend }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: yacr-smoke:${{ matrix.backend }}
          cache-from: type=gha,scope=${{ matrix.backend }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}-${{ matrix.arch }}

      - name: Smoke test
        run: .github/scripts/smoke-test.sh yacr-smoke:${{ matrix.backend }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the test build, so this is served from the build cache.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DECOMPRESSION_BACKEND=${{ matrix.backend }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_SLUG }},${{ env.GHCR_SLUG }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.backend }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.backend }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish (${{ matrix.backend }})
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: [7zip, libarchive]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.backend }}-*
          merge-multiple: true

      - name: Read YACReader version from Dockerfile
        id: yacr
        run: echo "version=$(grep -oP '^ARG YACR_VERSION="\K[^"]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      # Tags produced:
      #   7zip:       :latest  :10.4.0  :7zip  :7zip-10.4.0         (+ :<release-tag>, :<release-tag>-7zip)
      #   libarchive: :libarchive  :libarchive-10.4.0  :unarr     (+ :<release-tag>-libarchive)
      # :unarr is kept as a transition alias so existing users don't get stuck on 9.x.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.backend }}
            type=raw,value=${{ matrix.backend }}-${{ steps.yacr.outputs.version }}
            type=raw,value=latest,enable=${{ matrix.backend == '7zip' }}
            type=raw,value=${{ steps.yacr.outputs.version }},enable=${{ matrix.backend == '7zip' }}
            type=raw,value=unarr,enable=${{ matrix.backend == 'libarchive' }}
            type=ref,event=tag,enable=${{ matrix.backend == '7zip' }}
            type=ref,event=tag,suffix=-${{ matrix.backend }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          for slug in "$DOCKERHUB_SLUG" "$GHCR_SLUG"; do
            tags=$(jq -cr --arg s "$slug:" '.tags | map(select(startswith($s))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "${slug}@sha256:%s " *)
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${GHCR_SLUG}:${{ matrix.backend }}"
