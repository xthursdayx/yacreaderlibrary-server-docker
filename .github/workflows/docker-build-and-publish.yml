---
# Builds multi-arch (amd64 + arm64) images for each decompression backend from
# the single root Dockerfile. Buildx pushes a proper multi-arch manifest itself,
# so no per-arch tags or manual `docker manifest` steps are needed.
name: Build and push images
on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - root/**
      - .github/workflows/docker-build-and-publish.yml
  workflow_dispatch:

env:
  DOCKERHUB_SLUG: xthursdayx/yacreaderlibrary-server-docker
  GHCR_SLUG: ghcr.io/xthursdayx/yacreaderlibrary-server-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: [7zip, libarchive]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Read YACReader version from Dockerfile
        id: yacr
        run: echo "version=$(grep -oP '^ARG YACR_VERSION="\K[^"]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      # Tags produced:
      #   7zip:       :latest  :10.4.0  :7zip  :7zip-10.4.0         (+ :<release-tag>, :<release-tag>-7zip)
      #   libarchive: :libarchive  :libarchive-10.4.0  :unarr     (+ :<release-tag>-libarchive)
      # :unarr is kept as a transition alias so existing users don't get stuck on 9.x.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.backend }}
            type=raw,value=${{ matrix.backend }}-${{ steps.yacr.outputs.version }}
            type=raw,value=latest,enable=${{ matrix.backend == '7zip' }}
            type=raw,value=${{ steps.yacr.outputs.version }},enable=${{ matrix.backend == '7zip' }}
            type=raw,value=unarr,enable=${{ matrix.backend == 'libarchive' }}
            type=ref,event=tag,enable=${{ matrix.backend == '7zip' }}
            type=ref,event=tag,suffix=-${{ matrix.backend }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            DECOMPRESSION_BACKEND=${{ matrix.backend }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.backend }}
