name: Trivy Scanner
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: Scan published image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner on the image
        # consider pinning this to a release tag or commit SHA instead of @master
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/xthursdayx/yacreaderlibrary-server-docker:latest'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
